<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 전략 통제실 v2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        :root { --primary: #2563eb; --success: #059669; --warning: #d97706; --danger: #dc2626; --bg: #f1f5f9; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* 대시보드 그리드 */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; margin-bottom: 30px; }
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { font-size: 18px; margin-top: 0; display: flex; justify-content: space-between; }

        /* 섹터 순위 스타일 */
        .rank-item { display: flex; align-items: center; margin-bottom: 10px; padding: 10px; background: #f8fafc; border-radius: 8px; }
        .rank-num { width: 24px; font-weight: bold; color: var(--primary); }
        .rank-name { flex: 1; font-weight: 600; }
        .rank-count { font-size: 13px; color: #64748b; }

        /* 매트릭스 카드 스타일 */
        .sync-card { border-left: 5px solid #cbd5e1; padding: 15px; margin-bottom: 12px; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; }
        .sync-GOLD { border-left-color: var(--success); background: #f0fdf4; }
        .sync-TRICKLE { border-left-color: var(--primary); background: #eff6ff; }
        .sync-ISOLATED { border-left-color: var(--warning); background: #fffbeb; }
        .sync-DEAD { border-left-color: var(--danger); background: #fef2f2; }
        
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .badge-GOLD { background: var(--success); color: white; }

        /* 입력창 영역 */
        .input-section { background: #1e293b; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        textarea, input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: none; box-sizing: border-box; }
        .btn { cursor: pointer; padding: 10px 20px; border-radius: 6px; border: none; font-weight: bold; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }

        /* 탭 버튼 */
        .period-selector { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { padding: 5px 15px; border-radius: 20px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-size: 13px; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <section class="input-section">
            <h2>🚀 종목 인사이트 주입</h2>
            <div style="display: flex; gap: 10px;">
                <input type="date" id="target_date" style="width: 150px;">
                <input type="text" id="reason" placeholder="추천 사유 (예: 수급 특징주)">
            </div>
            <textarea id="raw_text" placeholder="005930 삼성전자&#10;000660 SK하이닉스" style="height: 80px;"></textarea>
            <button class="btn btn-primary" onclick="processInput()">분석 및 저장</button>
        </section>

        <div class="dashboard-grid">
            <div class="panel">
                <h2>🌊 섹터 모멘텀 순위
                    <div class="period-selector" id="period-btns">
                        <button class="tab-btn active" onclick="loadDashboard(14)">14D</button>
                        <button class="tab-btn" onclick="loadDashboard(60)">60D</button>
                    </div>
                </h2>
                <div id="sector-rank">계산 중...</div>
            </div>

            <div class="panel">
                <h2>🩺 동기화 진단 리포트 
                    <button class="tab-btn" onclick="addMyStock()">+ 내 종목 추가</button>
                </h2>
                <div id="sync-report">보유 종목을 등록해주세요.</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lvbqtatdemrbhfpgsflf.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_YBoGpmdtke1LaGS51Lgl6w_KPOgvmRN';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 오늘 날짜 기본 설정
        document.getElementById('target_date').valueAsDate = new Date();

        async function loadDashboard(days = 14) {
            // 버튼 활성화 표시
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event?.target?.classList?.add('active');

            const dateLimit = new Date();
            dateLimit.setDate(dateLimit.getDate() - days);
            const dateStr = dateLimit.toISOString().split('T')[0];

            // 1. 기간 내 데이터 가져오기
            const { data: stocks } = await client.from('stocks')
                .select('*')
                .gte('target_date', dateStr);

            // 2. 섹터 파워 계산 (배열 형태의 theme 집계)
            const themeCounts = {};
            stocks.forEach(s => {
                if (s.theme) s.theme.forEach(t => themeCounts[t] = (themeCounts[t] || 0) + 1);
            });
            const sortedThemes = Object.entries(themeCounts).sort((a,b) => b[1] - a[1]).slice(0, 10);
            
            // UI 반영: 섹터 순위
            const rankDiv = document.getElementById('sector-rank');
            rankDiv.innerHTML = sortedThemes.map(([name, count], i) => `
                <div class="rank-item">
                    <span class="rank-num">${i+1}</span>
                    <span class="rank-name">${name}</span>
                    <span class="rank-count">${count}회 언급</span>
                </div>
            `).join('');

            // 3. 내 포트폴리오 진단
            const { data: myStocks } = await client.from('my_portfolio').select('*');
            const topThemes = sortedThemes.slice(0, 5).map(t => t[0]); // 상위 5개 테마
            
            const reportDiv = document.getElementById('sync-report');
            if (!myStocks || myStocks.length === 0) {
                reportDiv.innerHTML = "<p>하단의 [+ 내 종목 추가] 버튼으로 보유 종목을 등록하세요.</p>";
                return;
            }

            // 각 보유 종목별 매트릭스 판정
            const reportHtml = await Promise.all(myStocks.map(async (ms) => {
                // 직접 추천 횟수 계산
                const directCount = stocks.filter(s => s.code === ms.code).length;
                
                // 내 종목의 테마 가져오기 (마스터 DB 참조)
                const { data: master } = await client.from('stock_master').select('theme').eq('code', ms.code).single();
                const myThemes = master?.theme ? master.theme.split(',').map(t => t.trim()) : [];
                
                // 섹터 수혜 여부 (상위 테마에 포함되는지)
                const isSectorHot = myThemes.some(mt => topThemes.includes(mt));

                let status = "DEAD", label = "완전 소외", desc = "시장 관심 밖. 교체 검토";
                if (directCount > 0 && isSectorHot) { status = "GOLD"; label = "골든 싱크"; desc = "주도 섹터 + 직접 추천 일치!"; }
                else if (isSectorHot) { status = "TRICKLE"; label = "낙수 효과"; desc = "섹터는 뜨거움. 순환매 대기"; }
                else if (directCount > 0) { status = "ISOLATED"; label = "개별 돌파"; desc = "섹터 힘 없이 종목만 반짝"; }

                return `
                    <div class="sync-card sync-${status}">
                        <div style="display:flex; justify-content:space-between;">
                            <strong>${ms.name} (${ms.code})</strong>
                            <span class="badge badge-${status}">${label}</span>
                        </div>
                        <div style="font-size:12px; color:#64748b; margin-top:5px;">
                            ${desc} | 직접추천: ${directCount}회 | 테마: ${myThemes.join(', ')}
                        </div>
                    </div>
                `;
            }));
            reportDiv.innerHTML = reportHtml.join('');
        }

        // 종목 파싱 및 저장 (v2.0)
        async function processInput() {
            const rawText = document.getElementById('raw_text').value;
            const targetDate = document.getElementById('target_date').value;
            const reason = document.getElementById('reason').value;
            
            const regex = /(\d{6})\s+([가-힣A-Za-z0-9&]+)/g;
            let match;
            const codes = [];
            const extracted = [];
            
            while ((match = regex.exec(rawText)) !== null) {
                codes.push(match[1]);
                extracted.push({ code: match[1], name: match[2] });
            }

            // 테마 매칭
            const { data: master } = await client.from('stock_master').select('code, theme').in('code', codes);
            const themeMap = {};
            if (master) master.forEach(m => themeMap[m.code] = m.theme);

            const uploadData = extracted.map(s => ({
                code: s.code,
                name: s.name,
                reason: reason,
                target_date: targetDate,
                theme: themeMap[s.code] ? themeMap[s.code].split(',').map(t => t.trim()) : []
            }));

            const { error } = await client.from('stocks').insert(uploadData);
            if (error) alert(error.message);
            else {
                alert("등록 완료!");
                document.getElementById('raw_text').value = '';
                loadDashboard();
            }
        }

        // 보유 종목 추가 팝업 (간이)
        async function addMyStock() {
            const code = prompt("보유 종목 코드를 입력하세요 (6자리)");
            const name = prompt("종목명을 입력하세요");
            if (code && name) {
                await client.from('my_portfolio').insert([{ code, name }]);
                loadDashboard();
            }
        }

        loadDashboard();
    </script>
</body>
</html>
